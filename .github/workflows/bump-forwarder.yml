name: "Bump Version - Forwarder"
run-name: "Bump Version - Forwarder ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version and revision. (Example: \"6.0.0-beta.1-1\")"
        required: true
      target-branch:
        description: "The branch to push the changes to"
        required: true

defaults:
  run:
    shell: "bash"

# Avoid having multiple workflows modifying the repo at the same time
concurrency: "repo-write"

jobs:
  bump:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Install dependencies"
        run: "pip3 install -r requirements.txt"

      - name: "Bump version to ${{ inputs.version }}"
        run: "./release.py --bump forwarder --version ${{ inputs.version }}"

      - name: "Generate README"
        run: "./release.py --generate-readme"

      - name: "Commit and push to ${{ inputs.target-branch }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.yml README.md
          git commit -m "Bump to ${{ inputs.version }}"
          git tag -m "Tag forwarder-${{ inputs.version }}" "forwarder-${{ inputs.version }}"
          git push origin "${{ inputs.target-branch }}"
          git push --tags
